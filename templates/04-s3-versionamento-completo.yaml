AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Stack 4 — Cenário completo: bucket com versionamento, regras de ciclo de vida
  (transição para Standard-IA e expiração de versões antigas), bucket de logs
  separado, e uma Lambda de auditoria disparada a cada novo objeto.
  Objetivo: consolidar versionamento, governança de custos e automação orientada a eventos.

Parameters:
  NomeBucketPrincipal:
    Type: String
  NomeBucketLogs:
    Type: String

Resources:
  BucketLogs:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Ref NomeBucketLogs
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PoliticaBucketLogs:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketLogs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PermitirServicoDeLogsDoS3
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub 'arn:aws:s3:::${NomeBucketLogs}/*'
            Condition:
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:s3:::${NomeBucketPrincipal}'
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'

  RoleLambdaAuditoria:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LeituraVersoes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucketVersions
                Resource:
                  - !Sub 'arn:aws:s3:::${NomeBucketPrincipal}'
                  - !Sub 'arn:aws:s3:::${NomeBucketPrincipal}/*'

  FuncaoAuditoria:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-auditoria'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt RoleLambdaAuditoria.Arn
      Timeout: 15
      Code:
        ZipFile: |
          def handler(event, context):
              for record in event.get('Records', []):
                  key = record['s3']['object']['key']
                  version = record['s3']['object'].get('versionId', 'sem-versionId')
                  print(f"Auditoria: objeto={key} versao={version}")
              return {"statusCode": 200}

  PermissaoInvocacaoAuditoria:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FuncaoAuditoria
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:s3:::${NomeBucketPrincipal}'

  BucketPrincipal:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: PermissaoInvocacaoAuditoria
    Properties:
      BucketName: !Ref NomeBucketPrincipal
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref BucketLogs
        LogFilePrefix: acesso-logs/
      LifecycleConfiguration:
        Rules:
          - Id: TransicaoEExpiracaoVersoes
            Status: Enabled
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt FuncaoAuditoria.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  BucketPrincipalCriado:
    Value: !Ref BucketPrincipal
  BucketLogsCriado:
    Value: !Ref BucketLogs
